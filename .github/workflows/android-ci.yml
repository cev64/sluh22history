name: Android CI

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'tools/**'
      - 'index.html'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/**'
      - 'index.html'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify league.json matches index.html
        run: |
          node tools/extract-league-data.js
          if ! git diff --quiet -- android/app/src/main/assets/league.json; then
            echo "::error::android/app/src/main/assets/league.json is stale."
            echo "Run 'node tools/extract-league-data.js' and commit the result."
            git diff -- android/app/src/main/assets/league.json
            exit 1
          fi

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: league-history-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
