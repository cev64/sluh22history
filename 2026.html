<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="2026 fantasy football season live hub: weekly results, standings, and the playoff picture as it stands today." />
  <title>League History · 2026 Live</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#071827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="League History" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <script src="pwa.js" defer></script>
  <style>
    :root {
      --ink: #0b1726;
      --muted: #637083;
      --line: #dce3eb;
      --surface: #ffffff;
      --surface-2: #f5f7fa;
      --page: #eef2f6;
      --navy: #071827;
      --navy-2: #102b43;
      --blue: #1769e0;
      --blue-2: #0f56bd;
      --red: #d71920;
      --gold: #f6b73c;
      --green: #16834a;
      --shadow: 0 12px 30px rgba(7, 24, 39, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(23, 105, 224, .08), transparent 24rem),
        linear-gradient(180deg, #f7f9fb 0, var(--page) 38rem, #f7f9fb 100%);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    button, select { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(7, 24, 39, .96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      color: #fff;
    }

    .topbar-inner {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand {
      color: inherit;
      text-decoration: none;
    }

    .brand-mark {
      width: 42px;
      height: 48px;
      position: relative;
      display: grid;
      place-items: center;
      font-weight: 900;
      letter-spacing: -.05em;
      background: linear-gradient(145deg, #fff 0%, #dce6f3 100%);
      color: var(--navy);
      clip-path: polygon(50% 0, 92% 16%, 86% 78%, 50% 100%, 14% 78%, 8% 16%);
      box-shadow: inset 0 0 0 3px rgba(215, 25, 32, .55);
      flex: 0 0 auto;
    }

    .brand-copy { min-width: 0; }
    .brand-kicker {
      display: block;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #9eb0c1;
      font-weight: 800;
      margin-bottom: 2px;
    }
    .brand-title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .year-control {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #c9d5df;
      font-size: 13px;
      font-weight: 700;
    }

    .year-control select {
      appearance: none;
      color: #fff;
      background: #16324a;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 10px;
      padding: 10px 38px 10px 14px;
      font-weight: 800;
      outline: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #fff 50%),
        linear-gradient(135deg, #fff 50%, transparent 50%);
      background-position: calc(100% - 16px) 16px, calc(100% - 11px) 16px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .hero {
      color: #fff;
      background:
        linear-gradient(90deg, rgba(7, 24, 39, .98) 0%, rgba(11, 40, 66, .96) 54%, rgba(23, 105, 224, .86) 100%),
        repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.025) 40px),
        repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,.025) 40px);
      border-bottom: 4px solid var(--red);
    }

    .hero-inner {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(330px, 430px);
      gap: 32px;
      align-items: center;
    }

    .season-hero-title {
      min-width: 0;
    }

    .eyebrow {
      color: #9fc4ff;
      text-transform: uppercase;
      letter-spacing: .19em;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: clamp(54px, 8vw, 92px);
      line-height: .9;
      letter-spacing: -.06em;
      margin: 0;
      max-width: 760px;
    }

    .champ-card {
      justify-self: end;
      width: min(100%, 430px);
      border-radius: 22px;
      padding: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.17);
      box-shadow: 0 24px 65px rgba(0,0,0,.28);
      position: relative;
      overflow: hidden;
    }

    .champ-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -60px;
      top: -70px;
      background: radial-gradient(circle, rgba(246,183,60,.45), transparent 65%);
      pointer-events: none;
    }

    .champ-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffe2a3;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-weight: 900;
    }

    .champ-team {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 18px 0;
    }

    .champ-team .team-badge { width: 62px; height: 62px; font-size: 29px; }
    .champ-team h2 { margin: 0; font-size: 26px; letter-spacing: -.035em; }
    .champ-team span { color: #bcd0e1; font-size: 13px; }

    .champ-score {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.13);
    }

    .champ-score strong { display: block; font-size: 22px; }
    .champ-score small { color: #aebdca; }
    .champ-score .versus { font-size: 11px; color: #7690a7; font-weight: 900; }
    .champ-score > div:last-child { text-align: right; }

    main {
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 70px;
    }

    .season-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: -18px;
      position: relative;
      z-index: 3;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 17px;
      box-shadow: 0 8px 24px rgba(7,24,39,.07);
      min-width: 0;
    }

    .metric-card small {
      display: block;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .metric-card strong {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 16px;
      letter-spacing: -.025em;
    }

    .metric-card span { color: var(--muted); font-size: 12px; }

    .page-toolbar {
      margin: 28px 0 18px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.04em;
    }

    .page-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .view-tabs {
      display: inline-flex;
      gap: 4px;
      background: #e4e9ef;
      padding: 4px;
      border-radius: 12px;
      flex-wrap: wrap;
    }

    .view-tab {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      color: #536174;
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      transition: .18s ease;
    }

    .view-tab:hover { color: var(--ink); }
    .view-tab.active {
      color: #fff;
      background: var(--navy-2);
      box-shadow: 0 5px 14px rgba(7,24,39,.18);
    }

    .view-panel { display: none; }
    .view-panel.active { display: block; animation: panelIn .2s ease; }
    @keyframes panelIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .division-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 19px 20px;
      background: linear-gradient(180deg, #fff, #f8fafc);
      border-bottom: 1px solid var(--line);
    }

    .card-head h3 {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 18px;
      letter-spacing: -.025em;
    }

    .division-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
    }

    .card-head span { color: var(--muted); font-size: 12px; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 555px;
    }

    th {
      color: #6b7788;
      font-size: 10px;
      letter-spacing: .09em;
      text-transform: uppercase;
      font-weight: 900;
      padding: 12px 14px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    th:first-child, th:nth-child(2) { text-align: left; }

    td {
      padding: 13px 14px;
      border-bottom: 1px solid #edf0f3;
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .15s ease; }
    tbody tr:hover { background: #f5f8fb; }
    td:first-child, td:nth-child(2) { text-align: left; }

    .rank {
      color: #7a8796;
      font-weight: 900;
      width: 36px;
    }

    .team-cell { min-width: 250px; }
    .team-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--blue-2);
      font-weight: 800;
      text-align: left;
    }
    .team-button:hover .team-name { text-decoration: underline; }

    .team-badge {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 10px;
      font-size: 17px;
      color: #fff;
      background: var(--team-color, var(--navy-2));
      border: 2px solid rgba(255,255,255,.5);
      box-shadow: 0 0 0 1px rgba(7,24,39,.12), inset 0 -8px 14px rgba(0,0,0,.13);
      flex: 0 0 auto;
    }

    .team-meta { display: flex; flex-direction: column; gap: 2px; }
    .team-name { color: var(--blue-2); font-size: 13px; }
    .owner { color: var(--muted); font-size: 11px; font-weight: 600; }

    .record { font-weight: 900; }
    .positive { color: var(--green); }
    .negative { color: #c92929; }
    .muted { color: var(--muted); }

    .final-card .card-head { padding-bottom: 15px; }
    .final-table { min-width: 900px; }
    .final-table .place { width: 56px; }
    .final-table .team-cell { min-width: 300px; }
    .champion-row { background: linear-gradient(90deg, rgba(246,183,60,.16), transparent 48%); }
    .champion-row:hover { background: linear-gradient(90deg, rgba(246,183,60,.22), #f8fafc 60%); }
    .place-medal { font-size: 17px; margin-right: 4px; }

    .sort-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 5px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      white-space: nowrap;
      cursor: pointer;
    }

    .sort-button:hover,
    .sort-button.active {
      color: var(--blue-2);
    }

    .sort-indicator {
      min-width: 10px;
      font-size: 11px;
      line-height: 1;
      color: var(--red);
    }

    .bracket-card { padding: 0; }

    .bracket-head {
      min-height: 0;
    }

    .bracket-head > div {
      display: flex;
      align-items: center;
    }

    .bracket-head h3 {
      margin: 0;
    }

    .bracket-head {
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: linear-gradient(180deg, #fff, #f8fafc);
    }
    .bracket-head h3 { margin: 0; font-size: 19px; }
    .bracket-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .bracket-tag {
      color: #fff;
      background: var(--red);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 8px 11px;
      white-space: nowrap;
    }

    .bracket-scroll { overflow-x: auto; }
    .bracket {
      min-width: 1050px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      padding: 24px;
      background:
        linear-gradient(rgba(255,255,255,.94), rgba(255,255,255,.94)),
        repeating-linear-gradient(90deg, #dfe7ef 0 1px, transparent 1px 48px),
        repeating-linear-gradient(0deg, #dfe7ef 0 1px, transparent 1px 48px);
    }

    .round {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .round-title {
      padding: 0 3px 12px;
      border-bottom: 3px solid var(--navy-2);
      margin-bottom: 18px;
    }
    .round-title strong { display: block; font-size: 13px; letter-spacing: .02em; }
    .round-title span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }

    .round-games { display: flex; flex-direction: column; justify-content: space-around; flex: 1; gap: 18px; }
    .round-2 .round-games { padding: 60px 0; gap: 100px; }
    .round-3 .round-games { justify-content: center; padding: 140px 0; }

    .matchup {
      position: relative;
      background: #fff;
      border: 1px solid #cfd8e2;
      border-radius: 14px;
      padding: 8px 12px;
      box-shadow: 0 7px 18px rgba(7,24,39,.07);
    }

    .matchup-row {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 8px 2px;
      color: #7e8996;
      font-size: 12px;
    }
    .matchup-row + .matchup-row { border-top: 1px solid #edf0f3; }
    .matchup-row.winner { color: var(--ink); font-weight: 900; }
    .matchup-row .seed { color: #758191; font-size: 10px; font-weight: 900; white-space: nowrap; }
    .matchup-row .score { font-size: 15px; font-variant-numeric: tabular-nums; }
    .matchup-row .mini-team { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .matchup-row .mini-team span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mini-badge {
      width: 23px; height: 23px; border-radius: 7px; display: grid; place-items: center;
      color: #fff; font-size: 12px; background: var(--team-color, var(--navy));
      flex: 0 0 auto;
    }
    .bye { min-height: 94px; display: flex; flex-direction: column; justify-content: center; }
    .bye-label { padding: 6px 2px 2px 56px; color: #8a95a2; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 900; }
    .championship-matchup {
      border: 2px solid var(--gold);
      box-shadow: 0 14px 34px rgba(246,183,60,.24);
    }
    .championship-matchup::before {
      content: "CHAMPION";
      position: absolute;
      right: 12px;
      top: -11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--gold);
      color: #2d2105;
      font-size: 8px;
      font-weight: 1000;
      letter-spacing: .1em;
    }


    .losers-card {
      margin-top: 22px;
    }

    .losers-card .bracket-head {
      background: linear-gradient(180deg, #fff, #fff8f7);
    }

    .losers-card .bracket-tag {
      background: #a62f2b;
    }

    .losers-bracket .round-2 .round-games,
    .losers-bracket .round-3 .round-games {
      justify-content: center;
      padding: 68px 0;
      gap: 18px;
    }

    .matchup-kicker {
      margin: -1px 2px 5px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .matchup-path {
      margin-top: 6px;
      padding: 8px 2px 1px;
      border-top: 1px solid #edf0f3;
      color: #687585;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .last-place-matchup {
      border: 2px solid #d6433d;
      box-shadow: 0 14px 34px rgba(214,67,61,.18);
    }

    .last-place-matchup::before {
      content: "LAST PLACE";
      position: absolute;
      right: 12px;
      top: -11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #d6433d;
      color: #fff;
      font-size: 8px;
      font-weight: 1000;
      letter-spacing: .12em;
    }

    .last-place-row {
      color: #a62f2b !important;
      font-weight: 900;
    }

    .source-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(4, 14, 23, .64);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      backdrop-filter: blur(3px);
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .team-drawer {
      position: fixed;
      z-index: 80;
      top: 0;
      right: 0;
      width: min(600px, 100%);
      height: 100dvh;
      background: #f6f8fa;
      box-shadow: -25px 0 65px rgba(0,0,0,.25);
      transform: translateX(104%);
      transition: transform .26s cubic-bezier(.2,.8,.2,1);
      display: flex;
      flex-direction: column;
    }
    .team-drawer.open { transform: translateX(0); }

    .drawer-hero {
      padding: 22px;
      color: #fff;
      background: linear-gradient(135deg, var(--drawer-color, var(--navy-2)), #071827 92%);
      position: relative;
      overflow: hidden;
    }
    .drawer-hero::after {
      content: "";
      position: absolute;
      width: 260px; height: 260px;
      right: -120px; top: -110px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
    }

    .drawer-close {
      position: absolute;
      top: 16px; right: 16px;
      z-index: 2;
      width: 38px; height: 38px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.1);
      color: #fff;
      border-radius: 10px;
      font-size: 22px;
      line-height: 1;
    }

    .drawer-team {
      display: flex;
      align-items: center;
      gap: 15px;
      padding-right: 46px;
    }
    .drawer-team .team-badge { width: 58px; height: 58px; font-size: 28px; }
    .drawer-team h2 { margin: 0 0 4px; font-size: 25px; letter-spacing: -.04em; }
    .drawer-team p { margin: 0; color: rgba(255,255,255,.72); font-size: 13px; }

    .drawer-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 18px;
    }
    .drawer-stat {
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      padding: 10px;
    }
    .drawer-stat small { display: block; color: rgba(255,255,255,.63); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; font-weight: 900; margin-bottom: 5px; }
    .drawer-stat strong { font-size: 14px; }

    .drawer-body {
      flex: 1;
      overflow: auto;
      padding: 18px;
    }

    .schedule-section { margin-bottom: 20px; }
    .schedule-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 2px 10px;
    }
    .schedule-heading h3 { margin: 0; font-size: 15px; }
    .schedule-heading span { color: var(--muted); font-size: 11px; }

    .schedule-list {
      background: #fff;
      border: 1px solid var(--line);

    /* --- v4 modern overhaul: depth, glass, gradient accents, motion
       (purely visual — data structure, columns and copy are unchanged) --- */

    /* Layered light mesh gives the page real depth instead of a flat wash */
    body {
      background:
        radial-gradient(1100px 520px at 84% -8%, rgba(23,105,224,.09), transparent 60%),
        radial-gradient(880px 460px at 2% 4%, rgba(246,183,60,.07), transparent 58%),
        radial-gradient(820px 640px at 50% 122%, rgba(23,105,224,.06), transparent 62%),
        linear-gradient(180deg, #f3f6fb 0%, #eaeff6 46%, #f3f6fb 100%);
    }

    /* Premium card depth: crisp top highlight, soft contact + ambient shadow */
    .card {
      border-color: rgba(15,34,55,.09);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.85),
        0 1px 2px rgba(10,22,38,.05),
        0 22px 46px -26px rgba(10,22,38,.42);
    }

    /* Warmer card header with a faint tri-color rule bleeding along its base */
    .card-head {
      position: relative;
      background: linear-gradient(180deg, #ffffff, #f5f9fd);
    }
    .card-head::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(23,105,224,.4) 22%, rgba(246,183,60,.45) 50%, rgba(215,25,32,.35) 78%, transparent);
      opacity: .75;
    }

    /* Section chip becomes a glossy gradient token with a soft blue glow */
    .division-chip {
      background: linear-gradient(150deg, var(--blue) 0%, var(--navy-2) 78%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 6px 14px -5px rgba(23,105,224,.6);
    }

    /* Table: brighter header, gradient row hover with a leading accent bar */
    th {
      background: linear-gradient(180deg, #fbfcfe, #f2f6fb);
    }
    tbody tr { transition: background .18s ease, box-shadow .18s ease; }
    tbody tr:hover {
      background: linear-gradient(90deg, rgba(23,105,224,.07), rgba(23,105,224,.02) 55%, transparent);
      box-shadow: inset 3px 0 0 rgba(23,105,224,.6);
    }
    /* Champion keeps a standing gold bar so it reads as first at a glance */
    .champion-row,
    .champion-row:hover { box-shadow: inset 3px 0 0 var(--gold); }

    /* Team badges get a subtle ring + lift so the emojis feel like real crests */
    .team-badge {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.35),
        0 6px 14px -6px rgba(7,24,39,.55);
    }

    /* Segmented view switcher reads as a modern pill control */
    .view-tabs {
      background: rgba(12,28,45,.06);
      border-radius: 999px;
      box-shadow: inset 0 1px 2px rgba(7,24,39,.08);
    }
    .view-tab {
      border-radius: 999px;
      transition: color .2s ease, background .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    .view-tab.active {
      background: linear-gradient(180deg, var(--navy-2), var(--navy));
      box-shadow: 0 8px 18px -7px rgba(7,24,39,.7), inset 0 1px 0 rgba(255,255,255,.12);
    }

    /* Outcome cards: gradient-lit rim + hover lift; champion adds the gold sheen */
    .outcome-card {
      border-color: rgba(255,255,255,.22);
      transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
    }
    .outcome-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 30px 64px -28px rgba(0,0,0,.6);
    }
    .champion-outcome { border-color: rgba(246,183,60,.42); }

    @media (prefers-reduced-motion: no-preference) {
      .champion-outcome::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.28) 50%, transparent 60%);
        background-size: 220% 100%;
        background-position: -120% 0;
        animation: v4Sheen 6s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }
    }
    @keyframes v4Sheen {
      0%, 15% { background-position: -120% 0; }
      55%, 100% { background-position: 140% 0; }
    }

    /* Animated aurora drift behind the hero content (motion-safe only) */
    @media (prefers-reduced-motion: no-preference) {
      .hero { overflow: hidden; }
      .hero::before {
        content: "";
        position: absolute;
        inset: -38% 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(closest-side, rgba(23,105,224,.35), transparent),
          radial-gradient(closest-side, rgba(246,183,60,.22), transparent);
        background-size: 55% 70%, 45% 60%;
        background-position: 8% 12%, 92% 88%;
        background-repeat: no-repeat;
        filter: blur(12px);
        opacity: .8;
        animation: v4Aurora 16s ease-in-out infinite alternate;
      }
      .hero-inner { position: relative; z-index: 1; }
    }
    @keyframes v4Aurora {
      0%   { background-position: 6% 10%, 94% 90%; }
      100% { background-position: 22% 26%, 78% 72%; }
    }

    /* Smooth link affordance on team names */
    .team-button { transition: transform .15s ease; }
    .team-name { transition: color .15s ease; }

    /* Season title carries a gradient accent bar — a crisp modern signature */
    .page-title h2 {
      position: relative;
      padding-left: 15px;
    }
    .page-title h2::before {
      content: "";
      position: absolute;
      left: 0;
      top: .12em;
      bottom: .12em;
      width: 5px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--blue), var(--gold));
    }

    .live-hero .hero-inner {

    /* Week rail ---------------------------------------------------- */

    .week-rail-wrap {
      width: min(1220px, calc(100% - 32px));
      margin: 22px auto 0;
    }

    .week-rail-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .week-rail-head strong {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .week-rail-head span {
      font-size: 12px;
      color: var(--muted);
    }

    .week-rail {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      scrollbar-width: thin;
    }

    .week-pill {
      flex: 0 0 auto;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 10px;
      padding: 8px 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      line-height: 1.1;
      color: var(--ink);
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
      transition: background .15s ease, color .15s ease;

      font-size: 9px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .week-pill:hover { background: var(--surface-2); }

    .week-pill.active {
      background: var(--navy);
      color: #fff;
    }

    .week-pill.active small { color: rgba(255, 255, 255, .66); }

    .week-pill.upcoming { color: var(--muted); }

    .week-pill.played small { color: var(--green); }

    /* Phones get a single dropdown instead of a rail that runs off-screen. */
    .week-select-wrap { display: none; }

      .week-rail { display: none; }

        display: block;
        position: relative;

        content: "";
        position: absolute;
        right: 18px;

    tr.seed-div td:first-child { box-shadow: inset 3px 0 0 var(--blue); }
    tr.seed-wc td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
    tr.seed-toilet td:first-child { box-shadow: inset 3px 0 0 #9aa6b6; }

    .result-pill.pending { background: #b9c3cd; }

    .streak {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 12px;
    }

    .streak.win { color: var(--green); }
    .streak.loss { color: var(--red); }

    /* Playoff picture ---------------------------------------------- */

    .picture-grid {
      display: grid;
      align-items: start;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }

    .seed-list {
      display: flex;
      flex-direction: column;
    }

    .seed-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 15px;
      border-top: 1px solid var(--line);
      min-width: 0;
    }

    .seed-row:first-child { border-top: 0; }

    .seed-chip {
      flex: 0 0 auto;
      width: 34px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
      background: var(--navy-2);
      letter-spacing: .02em;
    }

    .seed-chip.div { background: var(--blue); }
    .seed-chip.wc { background: var(--gold); color: #3a2a02; }
    .seed-chip.out { background: #9aa6b6; }

    .seed-row .seed-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .seed-row .seed-copy { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .seed-row .seed-copy strong { font-size: 14px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .seed-row .seed-copy span { font-size: 11.5px; color: var(--muted); }

    .seed-row .seed-line {
      flex: 0 0 auto;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .seed-row .seed-line strong { display: block; font-size: 14px; font-weight: 900; }
    .seed-row .seed-line span { font-size: 11px; color: var(--muted); }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 15px 13px;
    }

    .rule-tag {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .04em;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .rule-tag.flip { background: rgba(246, 183, 60, .16); border-color: rgba(246, 183, 60, .5); color: #7a5605; }

    .projected-matchups {
      display: grid;
      gap: 10px;
      padding: 14px 15px 16px;
    }

    .side-block { display: grid; gap: 8px; }

    .side-block + .side-block { margin-top: 6px; }

    .side-title {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .projected-game {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .projected-game .pg-head {
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .projected-game .pg-side {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      min-width: 0;
    }

    .projected-game .pg-side + .pg-side { border-top: 1px solid var(--line); }
    .projected-game .pg-side .seed { font-size: 10px; font-weight: 900; color: #758191; white-space: nowrap; min-width: 30px; }
    .projected-game .pg-side .pg-name { font-size: 13.5px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
    .projected-game .pg-side .pg-rec { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .projected-game .pg-bye { padding: 9px 12px; font-size: 11.5px; color: var(--muted); font-weight: 700; }

    /* Weekly summary ------------------------------------------------ */

    .summary-card .summary-body {
      padding: 4px 20px 20px;
      font-size: 15px;
      line-height: 1.68;
      color: #24354a;
    }

    .summary-card .summary-body h4 {
      margin: 20px 0 6px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .summary-card .summary-body p { margin: 0 0 12px; }
    .summary-card .summary-body p:last-child { margin-bottom: 0; }
    .summary-card .summary-body strong { color: var(--ink); }

    .summary-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px 0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .summary-superlatives {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      padding: 4px 20px 20px;
    }

    .superlative {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-2);
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .superlative small {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .superlative strong { font-size: 14px; font-weight: 800; line-height: 1.2; }
    .superlative span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* Season schedule grid (Week 0) --------------------------------- */

    .schedule-weeks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
      padding: 14px 15px 16px;
    }

    .schedule-week-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .schedule-week-card .swc-head {
      padding: 7px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .schedule-week-card .swc-head em {
      font-style: normal;
      color: var(--red);
      letter-spacing: .06em;
    }

    .swc-game {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      font-size: 12.5px;
      min-width: 0;
    }

    .swc-game + .swc-game { border-top: 1px solid var(--line); }
    .swc-game .swc-team { flex: 1 1 0; min-width: 0; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
    .swc-game .swc-team.right { text-align: right; }
    .swc-game .swc-vs { flex: 0 0 auto; color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .08em; }

    @media (max-width: 900px) {
      .live-hero .hero-inner { grid-template-columns: minmax(0, 1fr); }
      .hero-brief { order: 2; }
    }

    @media (max-width: 560px) {
      .live-hero .hero-inner { padding: 20px 14px 24px; gap: 14px; }
      .hero-brief { padding: 14px 15px; gap: 11px; }
      .brief-narrative { font-size: 13.5px; }
      .brief-headlines li { font-size: 12.5px; }
      .seed-row { padding: 10px 12px; gap: 9px; }
      .seed-chip { width: 30px; height: 27px; font-size: 10px; }
      .summary-card .summary-body { padding: 4px 14px 16px; font-size: 14.5px; }
      .summary-superlatives { padding: 4px 14px 16px; }
      .summary-meta { padding: 12px 14px 0; }
    }

    /* Seed, clinch, and tiebreaker markers in the standings tables ---- */

    .team-flags {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .seed-tag {
      font-size: 9.5px;
      font-weight: 900;
      letter-spacing: .03em;
      padding: 3px 5px;
      border-radius: 5px;
      color: #fff;
      background: var(--navy-2);
      white-space: nowrap;
    }

    .seed-tag.div { background: var(--blue); }
    .seed-tag.div.lead { background: var(--green); }
    .seed-tag.wc { background: var(--gold); color: #3a2a02; }
    .seed-tag.out { background: #9aa6b6; }

    .clinch-tag {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      display: inline-grid;
      place-items: center;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      background: var(--green);
      flex: 0 0 auto;
    }

    .clinch-tag.x { background: var(--blue); }
    .clinch-tag.e { background: #9aa6b6; }

    .why-btn {
      width: 17px;
      height: 17px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      font-style: italic;
      display: inline-grid;
      place-items: center;
      padding: 0;
      line-height: 1;
      flex: 0 0 auto;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    .why-btn:hover, .why-btn:focus-visible {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .why-pop {
      position: fixed;
      z-index: 90;
      width: max-content;
      max-width: min(300px, calc(100vw - 24px));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 13px;
      box-shadow: 0 18px 44px rgba(7, 24, 39, .24);
      padding: 13px 15px;
    }

    .why-head {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .06em;
      color: var(--muted);
      padding-bottom: 9px;
      margin-bottom: 11px;
      border-bottom: 1px solid var(--line);
    }

    .why-entry + .why-entry {
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .why-pop h4 {
      margin: 0 0 6px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--blue-2);
    }

    .why-pop p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink); }
    .why-pop .why-team { margin-top: 8px; font-size: 12px; color: var(--muted); }

    .standings-note .legend-key .seed-tag,
    .standings-note .legend-key .clinch-tag,
    .standings-note .legend-key .why-btn { margin-right: 2px; }

    td.gb, th.gb { white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* The seed and clinch markers widen the team cell, so let the division
       tables size it to content instead of holding a 250px floor. */
    .division-grid .team-cell { min-width: 168px; }

    /* Between the tablet stack point and full width the two-up cards are too
       narrow for eight columns, so stack them a little earlier. */
    @media (max-width: 1120px) {
      .division-grid { grid-template-columns: minmax(0, 1fr); }
    }

    /* Eight columns in a half-width card: tighten the gutters so DIV fits. */
    .division-grid th,
    .division-grid td { padding-left: 9px; padding-right: 9px; }

    /* Full projected bracket ---------------------------------------- */

    .bracket-rounds {
      display: grid;
      gap: 14px;
      padding: 15px 15px 17px;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      align-items: start;
    }

    .bracket-round { display: grid; gap: 9px; align-content: start; }

    .bracket-round .round-label {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .bracket-round .round-label span {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .pg-name.tbd { color: var(--muted); font-weight: 700; }

    @media (max-width: 700px) {
      .team-flags { margin-left: 6px; gap: 4px; }
      .bracket-rounds { padding: 12px 12px 14px; gap: 12px; }
    }
  </style>
</head>

  <footer class="footer">League History · 2026 season in progress · standings and seeding update as results are posted</footer>

  <script>
    /* =================================================================
       2026 LIVE SEASON HUB

       This page is generated from three editable blocks:

         1. `teams`             — franchise identity (rename here if an
                                  owner changes their team name mid-year)
         2. `results`           — weekly scores, added one week at a time
         3. `weeklySummaries`   — the written recap for each week

       Everything else (records, division standings, tiebreakers, the
       playoff field, the projected bracket, and Toilet Bowl seeding) is
       COMPUTED from those blocks using the league rulebook, so posting a
       week's scores is the only edit needed to move the whole page
       forward. Nothing about the champion or the league loser is shown —
       the season is live.
       ================================================================= */

    const SEASON = 2026;
    const REGULAR_WEEKS = 14;

    const teams = {
      first:    { name: "First and Ted",               owner: "Ted Williams",       division: "Xavier",    icon: "🏇",  color: "#7c3945" },
      game:     { name: "Game of Throws",              owner: "Charlie Vonderheid", division: "Xavier",    icon: "🏰",  color: "#c05b2a" },
      hamilton: { name: "Hamilton Administration",     owner: "Niko Nadreau",       division: "Xavier",    icon: "🎭",  color: "#304f91" },
      roll:     { name: "Roll Bill (Croskey-Merritt)", owner: "JP Torack",          division: "Xavier",    icon: "🦬",  color: "#9d542e" },
      infinity: { name: "To infinity and Bijan",       owner: "Ian Farroll",        division: "Xavier",    icon: "👑",  color: "#b78d0a" },
      hawaii:   { name: "Hawaii McLovins VIII",        owner: "Matt Windler",       division: "Ignatius",  icon: "🌴",  color: "#3a3c9d" },
      left:     { name: "The Left Tacklers",           owner: "Nathan Rich",        division: "Ignatius",  icon: "🛡️", color: "#166a83" },
      kareem:   { name: "Team Kareem Pie 🍑",          owner: "Matthew Kluba",      division: "Ignatius",  icon: "🏈",  color: "#719b70" },
      laporta:  { name: "LaPorta Potty",               owner: "Grant Thornberry",   division: "Ignatius",  icon: "🚽",  color: "#6a78a7" },
      jared:    { name: "Jared's Pack Attack",         owner: "Jared Thornberry",   division: "Ignatius",  icon: "🟣",  color: "#4d3f93" }
    };

    const divisionOrder = {
      Xavier: ["first", "game", "hamilton", "roll", "infinity"],
      Ignatius: ["hawaii", "left", "kareem", "laporta", "jared"]
    };

    // Full 2026 slate. Week 14 is the fixed rivalry week.
    const schedule = {
      1:  [["first", "game"], ["hamilton", "left"], ["roll", "laporta"], ["infinity", "jared"], ["hawaii", "kareem"]],
      2:  [["first", "roll"], ["game", "hawaii"], ["hamilton", "infinity"], ["left", "laporta"], ["kareem", "jared"]],
      3:  [["first", "kareem"], ["game", "infinity"], ["hamilton", "roll"], ["hawaii", "left"], ["laporta", "jared"]],
      4:  [["first", "hawaii"], ["game", "jared"], ["hamilton", "kareem"], ["roll", "left"], ["infinity", "laporta"]],
      5:  [["first", "hamilton"], ["game", "roll"], ["infinity", "jared"], ["hawaii", "laporta"], ["left", "kareem"]],
      6:  [["first", "infinity"], ["game", "left"], ["hamilton", "laporta"], ["roll", "kareem"], ["hawaii", "jared"]],
      7:  [["first", "hawaii"], ["game", "infinity"], ["hamilton", "roll"], ["left", "jared"], ["kareem", "laporta"]],
      8:  [["first", "roll"], ["game", "laporta"], ["hamilton", "jared"], ["infinity", "left"], ["hawaii", "kareem"]],
      9:  [["first", "game"], ["hamilton", "kareem"], ["roll", "jared"], ["infinity", "hawaii"], ["left", "laporta"]],
      10: [["first", "left"], ["game", "hamilton"], ["roll", "infinity"], ["hawaii", "laporta"], ["kareem", "jared"]],
      11: [["first", "laporta"], ["game", "kareem"], ["hamilton", "infinity"], ["roll", "hawaii"], ["left", "jared"]],
      12: [["first", "hamilton"], ["game", "roll"], ["infinity", "kareem"], ["hawaii", "left"], ["laporta", "jared"]],
      13: [["first", "jared"], ["game", "left"], ["hamilton", "hawaii"], ["roll", "infinity"], ["kareem", "laporta"]],
      14: [["first", "infinity"], ["game", "hamilton"], ["roll", "laporta"], ["hawaii", "jared"], ["left", "kareem"]]
    };

    const rivalryWeek = 14;

    /* -----------------------------------------------------------------
       RESULTS — add one entry per week as the screenshots come in.
       Shape: week: [[teamId, score, teamId, score], ...]
       Example:
         1: [["first", 118.42, "game", 104.06], ...]
       ----------------------------------------------------------------- */
    const results = {};

    /* -----------------------------------------------------------------
       WEEKLY SUMMARIES — the written recap shown on each week's tab.
       `body` is an array of paragraphs; `headline` is optional.
       ----------------------------------------------------------------- */
    const weeklySummaries = {
      0: {
        headline: "Ten teams, two divisions, everything still on the table.",
        body: [
          "Nothing has been played yet, so every record below reads 0–0 and the playoff picture is a blank bracket waiting on Week 1. What is settled is the structure: ten teams split into the <strong>Xavier</strong> and <strong>Ignatius</strong> divisions, fourteen regular-season weeks, and a Week 14 rivalry slate that has been locked in since the rulebook was signed.",
          "Six teams reach the playoffs. Each division champion takes a Week 15 bye and the division runners-up land on their own side of the bracket. The last two spots are league-wide wild cards, awarded on record with points for as the first tiebreaker — so a third-place finish in a loaded division still plays in December.",
          "The four teams left over get reseeded 7 through 10 for the Toilet Bowl ladder, where winning early is the whole point: once you win, you cannot finish last. Week 15 has every team in the league playing for something.",
          "Standings, seeding, and the projected bracket on this page recompute automatically the moment a week's scores are posted."
        ],
        generated: "Preseason outlook"
      }
    };

    /* =================================================================
       ENGINE — records, tiebreakers, seeding
       ================================================================= */

    const TEAM_IDS = Object.keys(teams);
    const DIVISION_NAMES = Object.keys(divisionOrder);

    const playedWeeks = Object.keys(results)
      .map(Number)
      .filter((w) => Array.isArray(results[w]) && results[w].length)
      .sort((a, b) => a - b);

    const lastPlayedWeek = playedWeeks.length ? playedWeeks[playedWeeks.length - 1] : 0;

    const fmt = (n) => Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmt1 = (n) => Number(n).toFixed(1);
    const pctText = (v) => v.toFixed(3).replace(/^0/, "");

    function gamesThrough(week) {
      const out = [];
      playedWeeks.filter((w) => w <= week).forEach((w) => {
        results[w].forEach(([a, as, b, bs]) => out.push({ week: w, a, as, b, bs }));
      });
      return out;
    }

    function blankLine(id) {
      return {
        id,
        wins: 0, losses: 0, ties: 0, gp: 0,
        pf: 0, pa: 0,
        divWins: 0, divLosses: 0, divTies: 0,
        form: []
      };
    }

    // Records for every team through the given week.
    function computeStats(week) {
      const stats = {};
      TEAM_IDS.forEach((id) => { stats[id] = blankLine(id); });

      gamesThrough(week).forEach((g) => {
        const sameDivision = teams[g.a].division === teams[g.b].division;
        [[g.a, g.as, g.b, g.bs], [g.b, g.bs, g.a, g.as]].forEach(([id, own, oppId, opp]) => {
          const line = stats[id];
          line.gp += 1;
          line.pf += own;
          line.pa += opp;
          if (own > opp) { line.wins += 1; if (sameDivision) line.divWins += 1; line.form.push("W"); }
          else if (own < opp) { line.losses += 1; if (sameDivision) line.divLosses += 1; line.form.push("L"); }
          else { line.ties += 1; if (sameDivision) line.divTies += 1; line.form.push("T"); }
        });
      });

      TEAM_IDS.forEach((id) => {
        const t = stats[id];
        t.pct = t.gp ? (t.wins + t.ties * 0.5) / t.gp : 0;
        t.divGp = t.divWins + t.divLosses + t.divTies;
        t.divPct = t.divGp ? (t.divWins + t.divTies * 0.5) / t.divGp : 0;
        t.record = t.ties ? `${t.wins}–${t.losses}–${t.ties}` : `${t.wins}–${t.losses}`;
        t.divRecord = t.divTies ? `${t.divWins}–${t.divLosses}–${t.divTies}` : `${t.divWins}–${t.divLosses}`;
        t.pfg = t.gp ? t.pf / t.gp : 0;
        t.pag = t.gp ? t.pa / t.gp : 0;
        t.diff = t.pf - t.pa;
        t.diffPerGame = t.gp ? t.diff / t.gp : 0;
        t.streak = streakOf(t.form);
      });

      return stats;
    }

    function streakOf(form) {
      if (!form.length) return null;
      const last = form[form.length - 1];
      let n = 0;
      for (let i = form.length - 1; i >= 0 && form[i] === last; i--) n += 1;
      return { type: last, count: n, text: `${last}${n}` };
    }

    // Head-to-head record for `a` against `b` through the given week.
    function headToHead(a, b, week) {
      let w = 0, l = 0, t = 0;
      gamesThrough(week).forEach((g) => {
        let own, opp;
        if (g.a === a && g.b === b) { own = g.as; opp = g.bs; }
        else if (g.b === a && g.a === b) { own = g.bs; opp = g.as; }
        else return;
        if (own > opp) w += 1; else if (own < opp) l += 1; else t += 1;
      });
      return { w, l, t, played: w + l + t };
    }

    // Head-to-head win percentage against everyone else in a tied group.
    function groupH2HPct(id, group, week) {
      let w = 0, l = 0, t = 0;
      group.forEach((other) => {
        if (other === id) return;
        const r = headToHead(id, other, week);
        w += r.w; l += r.l; t += r.t;
      });
      const played = w + l + t;
      return played ? (w + t * 0.5) / played : null;
    }

    /* Rulebook 4.1.1 — two-team tie in the division standings:
       head-to-head, then points for, then intra-division record, then coin flip. */
    // A team can be caught in several races at once — its division, the
    // wild-card order, the Toilet Bowl reseed — so reasons accumulate.
    function addReason(reasons, id, entry) {
      if (!reasons) return;
      (reasons[id] = reasons[id] || []).push(entry);
    }

    function breakTwoWay(a, b, week, stats, flips, reasons, race = "Division standings") {
      const h = headToHead(a, b, week);
      const note = (win, lose, criterion, detail) => {
        addReason(reasons, win, { race, over: win === a ? b : a, criterion, detail });
        addReason(reasons, lose, { race, under: win, criterion, detail });
        return [win, lose];
      };

      if (h.played && h.w !== h.l) {
        const [win, lose] = h.w > h.l ? [a, b] : [b, a];
        const hi = Math.max(h.w, h.l), lo = Math.min(h.w, h.l);
        return note(win, lose, "Head-to-head",
          `${teams[win].name} won the season series against ${teams[lose].name}, ${hi}–${lo}.`);
      }
      if (stats[a].pf !== stats[b].pf) {
        const [win, lose] = stats[a].pf > stats[b].pf ? [a, b] : [b, a];
        const split = h.played ? ` The teams split head-to-head ${h.w}–${h.l}.` : " They had not played yet.";
        return note(win, lose, "Points for",
          `${teams[win].name} scored ${fmt(stats[win].pf)} to ${teams[lose].name}'s ${fmt(stats[lose].pf)}.${split}`);
      }
      if (stats[a].divPct !== stats[b].divPct) {
        const [win, lose] = stats[a].divPct > stats[b].divPct ? [a, b] : [b, a];
        return note(win, lose, "Division record",
          `Head-to-head and points for were level, so division record decided it: ${stats[win].divRecord} to ${stats[lose].divRecord}.`);
      }
      flips.push([a, b]);
      const flipDetail = `${teams[a].name} and ${teams[b].name} are level on every tiebreaker. The rulebook goes to a coin flip.`;
      addReason(reasons, a, { race, over: b, criterion: "Coin flip", detail: flipDetail });
      addReason(reasons, b, { race, under: a, criterion: "Coin flip", detail: flipDetail });
      return [a, b];
    }

    /* Rulebook 4.1.2 / 4.1.3 — three- and four-team ties resolve by head-to-head
       record among the tied teams, then the resulting sub-groups drop back down
       to the smaller-tie rules. Identical head-to-head across the whole group
       ranks on points for. */
    function breakTie(group, week, stats, flips, reasons, race = "Division standings") {
      if (group.length <= 1) return group.slice();
      if (group.length === 2) return breakTwoWay(group[0], group[1], week, stats, flips, reasons, race);

      const scored = group.map((id) => ({ id, h2h: groupH2HPct(id, group, week) }));
      const distinct = [...new Set(scored.map((s) => (s.h2h === null ? "none" : s.h2h.toFixed(6))))];

      if (distinct.length <= 1) {
        const byPoints = group.slice().sort((a, b) => stats[b].pf - stats[a].pf);
        for (let i = 1; i < byPoints.length; i++) {
          if (stats[byPoints[i - 1]].pf === stats[byPoints[i]].pf) flips.push([byPoints[i - 1], byPoints[i]]);
        }
        const ladder = byPoints.map((id) => `${teams[id].name} ${fmt(stats[id].pf)}`).join(", ");
        byPoints.forEach((id, i) => {
          addReason(reasons, id, { race, over: byPoints[i + 1] || null, criterion: "Points for",
            detail: `These teams had the same head-to-head record against each other, so the rulebook ranks them on points for: ${ladder}.` });
        });
        return byPoints;
      }

      if (reasons) {
        const summary = group
          .map((id) => ({ id, r: groupRecordVs(id, group, week) }))
          .sort((x, y) => (y.r.w - y.r.l) - (x.r.w - x.r.l))
          .map((x) => `${teams[x.id].name} ${x.r.w}–${x.r.l}`)
          .join(", ");
        group.forEach((id) => {
          addReason(reasons, id, { race, criterion: `Head-to-head among ${group.length} tied teams`,
            detail: `Records against the other tied teams: ${summary}.` });
        });
      }

      const buckets = [];
      scored
        .slice()
        .sort((a, b) => (b.h2h === null ? -1 : b.h2h) - (a.h2h === null ? -1 : a.h2h))
        .forEach((entry) => {
          const key = entry.h2h === null ? "none" : entry.h2h.toFixed(6);
          const bucket = buckets.find((x) => x.key === key);
          if (bucket) bucket.ids.push(entry.id);
          else buckets.push({ key, ids: [entry.id] });
        });

      return buckets.flatMap((bucket) => breakTie(bucket.ids, week, stats, flips, reasons, race));
    }

    // Win-loss record against a specific set of teams, for tiebreaker explanations.
    function groupRecordVs(id, group, week) {
      let w = 0, l = 0;
      group.forEach((other) => {
        if (other === id) return;
        const r = headToHead(id, other, week);
        w += r.w; l += r.l;
      });
      return { w, l };
    }

    // Division standings: record first, ties resolved by the rulebook ladder.
    function orderDivision(division, week, stats, flips, reasons) {
      const ids = divisionOrder[division].slice();
      const buckets = [];
      ids
        .slice()
        .sort((a, b) => stats[b].pct - stats[a].pct || stats[b].wins - stats[a].wins)
        .forEach((id) => {
          const key = `${stats[id].wins}-${stats[id].losses}-${stats[id].ties}`;
          const bucket = buckets.find((x) => x.key === key);
          if (bucket) bucket.ids.push(id);
          else buckets.push({ key, ids: [id] });
        });
      return buckets.flatMap((bucket) => breakTie(bucket.ids, week, stats, flips, reasons, "Division standings"));
    }

    /* Games back of a leader, the standard baseball formula. */
    function gamesBack(leader, team) {
      return ((leader.wins - team.wins) + (team.losses - leader.losses)) / 2;
    }

    /* Clinch and elimination flags. Every test here is a *sufficient*
       condition, so a badge is never shown unless it is mathematically
       settled; a team can be safe before the badge appears, never after.

       The key structural fact: only the top two of each division take
       division seeds, so if a team finishes third or worse, the teams that
       beat it in its own division are holding division seeds, not wild
       cards. That means a third-place team's only wild-card rivals are the
       other division's non-top-two teams, plus any of its own division
       beyond the two ahead of it. */
    function clinchFlags(stats, divisions, playoffField) {
      const maxWins = (id) => stats[id].wins + Math.max(0, REGULAR_WEEKS - stats[id].gp);
      const minWins = (id) => stats[id].wins;
      const rivalsOf = (id) => divisionOrder[teams[id].division].filter((x) => x !== id);

      // Rivals who can still finish level with or ahead of this team.
      const couldPass = (id) => rivalsOf(id).filter((x) => maxWins(x) >= minWins(id)).length;
      // Certain to take a division seed, so never in the wild-card pool.
      const lockedTopTwo = (id) => couldPass(id) <= 1;
      // Certain to miss a division seed, so certain to be in the pool.
      const lockedOutOfTopTwo = (id) => rivalsOf(id).filter((x) => minWins(x) > maxWins(id)).length >= 2;

      const seasonOver = TEAM_IDS.every((id) => stats[id].gp >= REGULAR_WEEKS);
      const flags = {};

      TEAM_IDS.forEach((id) => {
        if (seasonOver) {
          flags[id] = divisions[teams[id].division][0] === id ? "z"
            : playoffField.includes(id) ? "x" : "e";
          return;
        }

        const rivals = rivalsOf(id);

        // Nobody left who can even draw level: division and bye are locked.
        if (rivals.every((x) => maxWins(x) < minWins(id))) { flags[id] = "z"; return; }

        // Guaranteed a top-two finish, which is a berth on its own.
        if (couldPass(id) <= 1) { flags[id] = "x"; return; }

        // Otherwise the team may fall to third, so count who could actually
        // beat it for a wild card. Its own division contributes only the
        // rivals beyond the two holding division seeds.
        const ownAhead = rivals.filter((x) => maxWins(x) >= minWins(id)).length;
        const ownPool = Math.max(0, ownAhead - 2);
        const otherPool = TEAM_IDS.filter((x) =>
          teams[x].division !== teams[id].division &&
          maxWins(x) >= minWins(id) &&
          !lockedTopTwo(x)).length;
        if (ownPool + otherPool <= 1) { flags[id] = "x"; return; }

        // Elimination is the mirror image: out of the division race for
        // certain, and with at least two certain wild-card rivals ahead.
        const divBeaten = rivals.filter((x) => minWins(x) > maxWins(id)).length;
        const poolBeaten = Math.max(0, divBeaten - 2) + TEAM_IDS.filter((x) =>
          teams[x].division !== teams[id].division &&
          minWins(x) > maxWins(id) &&
          lockedOutOfTopTwo(x)).length;
        flags[id] = (divBeaten >= 2 && poolBeaten >= 2) ? "e" : null;
      });

      return flags;
    }

    const CLINCH_KEY = {
      z: { label: "z", title: "Clinched division and the first-round bye" },
      x: { label: "x", title: "Clinched a playoff berth" },
      e: { label: "e", title: "Eliminated from playoff contention" }
    };

    /* Wild cards and division-runner-up ordering: games won, then points for,
       then a coin flip. */
    function orderByRecordThenPoints(ids, stats, flips, reasons, race) {
      const ordered = ids.slice().sort((a, b) => (stats[b].wins - stats[a].wins) || (stats[b].pf - stats[a].pf));
      for (let i = 1; i < ordered.length; i++) {
        const p = stats[ordered[i - 1]], c = stats[ordered[i]];
        if (p.wins === c.wins && p.pf === c.pf) flips.push([ordered[i - 1], ordered[i]]);
      }
      // This race spans both divisions, so teams that never tied inside their
      // own division can still be separated here.
      recordWinGroupTies(ordered, stats, reasons, race, (group) => {
        const ladder = group.map((id) => `${teams[id].name} ${fmt(stats[id].pf)}`).join(", ");
        return { criterion: "Points for", detail: `${group.length} teams sat at ${stats[group[0]].record}. The rulebook ranks them on points for: ${ladder}.` };
      });
      return ordered;
    }

    /* Any run of teams level on wins inside an ordered race was separated by
       something other than record, so each of them gets an explanation. */
    function recordWinGroupTies(ordered, stats, reasons, race, describe) {
      if (!reasons || !race) return;
      let i = 0;
      while (i < ordered.length) {
        let j = i;
        while (j + 1 < ordered.length && stats[ordered[j + 1]].wins === stats[ordered[i]].wins) j += 1;
        if (j > i) {
          const group = ordered.slice(i, j + 1);
          const { criterion, detail } = describe(group);
          group.forEach((id, k) => {
            addReason(reasons, id, { race, criterion, detail, over: group[k + 1] || null, under: k ? group[k - 1] : null });
          });
        }
        i = j + 1;
      }
    }

    /* Toilet Bowl reseeding: games won, points for, head-to-head, coin flip. */
    function orderToilet(ids, week, stats, flips, reasons) {
      const ordered = ids.slice().sort((a, b) => {
        if (stats[b].wins !== stats[a].wins) return stats[b].wins - stats[a].wins;
        if (stats[b].pf !== stats[a].pf) return stats[b].pf - stats[a].pf;
        const h = headToHead(a, b, week);
        if (h.played && h.w !== h.l) return h.l - h.w;
        return 0;
      });
      for (let i = 1; i < ordered.length; i++) {
        const a = ordered[i - 1], b = ordered[i];
        const h = headToHead(a, b, week);
        if (stats[a].wins === stats[b].wins && stats[a].pf === stats[b].pf && (!h.played || h.w === h.l)) flips.push([a, b]);
      }
      recordWinGroupTies(ordered, stats, reasons, "Toilet Bowl seeding", (group) => {
        const ladder = group.map((id) => `${teams[id].name} ${fmt(stats[id].pf)}`).join(", ");
        return { criterion: "Points for", detail: `${group.length} teams sat at ${stats[group[0]].record}. Toilet Bowl seeding reranks on wins, then points for: ${ladder}.` };
      });
      return ordered;
    }

    /* The whole playoff picture as it stands after the given week. */
    function buildPicture(week) {
      const stats = computeStats(week);
      const flips = [];

      const reasons = {};
      const divisions = {};
      DIVISION_NAMES.forEach((d) => { divisions[d] = orderDivision(d, week, stats, flips, reasons); });

      const champs = DIVISION_NAMES.map((d) => ({ division: d, id: divisions[d][0] }));
      const runnersUp = DIVISION_NAMES.map((d) => ({ division: d, id: divisions[d][1] }));

      const locked = new Set([...champs, ...runnersUp].map((x) => x.id));
      const rest = TEAM_IDS.filter((id) => !locked.has(id));

      const wildcardOrder = orderByRecordThenPoints(rest, stats, flips, reasons, "Wild-card race");
      const wildcards = wildcardOrder.slice(0, 2);
      const toiletSeeds = orderToilet(wildcardOrder.slice(2), week, stats, flips, reasons);

      // The better runner-up faces the worse wild card, and vice versa.
      const runnerOrder = orderByRecordThenPoints(runnersUp.map((r) => r.id), stats, flips, reasons, "Runner-up seeding");
      const betterRunner = runnersUp.find((r) => r.id === runnerOrder[0]);
      const worseRunner = runnersUp.find((r) => r.id === runnerOrder[1]);

      const sideOf = (runner, wildcard) => ({
        division: runner.division,
        one: champs.find((c) => c.division === runner.division).id,
        two: runner.id,
        three: wildcard
      });

      const sides = [sideOf(betterRunner, wildcards[1]), sideOf(worseRunner, wildcards[0])];

      const seedLabels = {};
      DIVISION_NAMES.forEach((d) => {
        seedLabels[divisions[d][0]] = { chip: `${d.charAt(0)}1`, kind: "div", note: `${d} leader · Week 15 bye` };
        seedLabels[divisions[d][1]] = { chip: `${d.charAt(0)}2`, kind: "div", note: `${d} runner-up` };
      });
      wildcards.forEach((id, i) => {
        seedLabels[id] = { chip: `WC${i + 1}`, kind: "wc", note: i === 0 ? "Top wild card" : "Second wild card" };
      });
      toiletSeeds.forEach((id, i) => {
        seedLabels[id] = { chip: `#${i + 7}`, kind: "out", note: `Toilet Bowl seed ${i + 7}` };
      });

      const flipPairs = flips.filter(([a, b], i, arr) =>
        arr.findIndex(([x, y]) => (x === a && y === b) || (x === b && y === a)) === i);

      const result = {
        week, stats, divisions, champs, runnersUp,
        wildcards, wildcardOrder, toiletSeeds, sides,
        seedLabels, flips: flipPairs, reasons,
        playoffField: [
          ...champs.map((c) => c.id),
          ...runnersUp.map((r) => r.id),
          ...wildcards
        ],
        firstOut: wildcardOrder[2] || null
      };

      result.flags = clinchFlags(stats, divisions, result.playoffField);
      return result;
    }


    /* =================================================================
       VIEW STATE
       ================================================================= */

    const VIEWS = ["results", "standings", "picture", "summary"];

    const state = {
      week: lastPlayedWeek,
      view: "results"
    };

    // Standings and the playoff picture for a week that has not been played
    // yet fall back to the most recent completed week.
    function asOfWeek(week) {
      const done = playedWeeks.filter((w) => w <= week);
      return done.length ? done[done.length - 1] : 0;
    }

    const weekLabel = (w) => (w === 0 ? "Preseason" : `Week ${w}`);
    const isPlayed = (w) => playedWeeks.includes(w);

    function viewLabels(week) {
      if (week === 0) return { results: "Schedule", standings: "Standings", picture: "Playoff Picture", summary: "Preseason" };
      if (isPlayed(week)) return { results: "Results", standings: "Standings", picture: "Playoff Picture", summary: "Weekly Summary" };
      return { results: "Matchups", standings: "Standings", picture: "Playoff Picture", summary: "Weekly Summary" };
    }

    /* =================================================================
       SHARED PIECES
       ================================================================= */

    function teamButton(id) {
      const t = teams[id];
      return `
        <button class="team-button" data-team="${id}" aria-label="Open ${t.name} schedule">
          <span class="team-badge" style="--team-color:${t.color}">${t.icon}</span>
          <span class="team-meta"><span class="team-name">${t.name}</span><span class="owner">${t.owner}</span></span>
        </button>`;
    }

    function miniTeam(id, extra = "") {
      const t = teams[id];
      return `<span class="mini-badge" style="--team-color:${t.color}">${t.icon}</span>${extra}`;
    }

    function emptyState(title, copy) {
      return `<div class="empty-state"><strong>${title}</strong><p>${copy}</p></div>`;
    }

    function cardHead(title, chip, meta) {
      return `<div class="card-head">
        <h3>${chip ? `<span class="division-chip">${chip}</span>` : ""}${title}</h3>
        ${meta ? `<span>${meta}</span>` : ""}
      </div>`;
    }

    /* =================================================================
       HERO
       ================================================================= */

    function renderHero(week) {
      const asOf = asOfWeek(week);
      const preseason = lastPlayedWeek === 0;

      document.getElementById("liveBadgeText").textContent = preseason ? "Preseason" : `Through Week ${lastPlayedWeek}`;
      document.getElementById("liveHeadline").textContent = "2026 Season";
      document.getElementById("liveSubhead").textContent = preseason
        ? `Ten teams. ${REGULAR_WEEKS} weeks. Six make the playoffs.`
        : `Week ${lastPlayedWeek} of ${REGULAR_WEEKS}. Six make the playoffs, four fall to the Toilet Bowl.`;

      const brief = preseason ? preseasonBrief : inSeasonBrief(asOf);
      document.getElementById("heroBrief").innerHTML = `
        <span class="brief-label">${brief.label}</span>
        <p class="brief-narrative">${brief.narrative}</p>
        <ul class="brief-headlines">
          ${brief.headlines.map((h) => `<li><span>${h}</span></li>`).join("")}
        </ul>`;
    }

    /* Written once, from the league's own history. Update it if a storyline
       goes stale before Week 1. */
    const preseasonBrief = {
      label: "Storylines",
      narrative: "<strong>Game of Throws</strong> defends a title it won from the #2 seed at 8–6, three years after finishing dead last twice in a row. Nobody has gone back-to-back since <strong>Hamilton Administration</strong> in 2021 and 2022.",
      headlines: [
        "<strong>Hawaii McLovins VIII</strong> won 12 games last year and still lost in the semis.",
        "<strong>Jared's Pack Attack</strong> is coming off 1–13 — and draws Windler in Rivalry Week.",
        "<strong>Grant Thornberry</strong> has taken two of the last three punishments."
      ]
    };

    /* In-season the brief is generated from the standings, so it stays true
       to whatever has actually been played. */
    function inSeasonBrief(asOf) {
      const picture = buildPicture(asOf);
      const stats = picture.stats;
      const name = (id) => `<strong>${teams[id].name}</strong>`;

      const leaders = DIVISION_NAMES.map((d) => {
        const ids = picture.divisions[d];
        const top = ids[0];
        const tied = ids.filter((id) => stats[id].wins === stats[top].wins && stats[id].losses === stats[top].losses);
        return { division: d, id: top, tied, record: stats[top].record };
      });

      const count = ["", "", "Two", "Three", "Four", "Five"];
      const narrative = leaders.map((l) => l.tied.length > 1
        ? `${count[l.tied.length]} teams share the top of <strong>${l.division}</strong> at ${l.record}, with ${name(l.id)} holding the tiebreaker.`
        : `${name(l.id)} leads <strong>${l.division}</strong> at ${l.record}.`).join(" ");

      const headlines = [];

      const lastIn = picture.wildcards[1];
      const firstOut = picture.firstOut;
      if (lastIn && firstOut) {
        const gap = stats[lastIn].wins - stats[firstOut].wins;
        headlines.push(gap === 0
          ? `${name(lastIn)} holds the last playoff spot over ${name(firstOut)} on points for, by ${fmt(stats[lastIn].pf - stats[firstOut].pf)}.`
          : `${name(lastIn)} holds the last playoff spot, ${gap} game${gap === 1 ? "" : "s"} up on ${name(firstOut)}.`);
      }

      const pointsLeader = TEAM_IDS.slice().sort((a, b) => stats[b].pf - stats[a].pf)[0];
      const inField = picture.playoffField.includes(pointsLeader);
      headlines.push(inField
        ? `${name(pointsLeader)} leads the league in scoring at ${fmt1(stats[pointsLeader].pfg)} a week.`
        : `${name(pointsLeader)} leads the league in scoring and is still on the outside.`);

      const hot = TEAM_IDS
        .filter((id) => stats[id].streak && stats[id].streak.type === "W" && stats[id].streak.count >= 2)
        .sort((a, b) => stats[b].streak.count - stats[a].streak.count)[0];
      if (hot) headlines.push(`${name(hot)} has won ${stats[hot].streak.count} straight.`);

      const basement = picture.toiletSeeds[3];
      if (basement && headlines.length < 3) headlines.push(`${name(basement)} sits last at ${stats[basement].record}.`);

      return { label: `Where it stands · Week ${asOf}`, narrative, headlines: headlines.slice(0, 3) };
    }


    /* =================================================================
       STANDINGS MARKERS — seeds, clinch flags, tiebreak explanations
       ================================================================= */

    // Populated as standings render; the popover reads explanations from here.
    const whyStore = {};

    function seedTag(picture, id) {
      const label = picture.seedLabels[id];
      if (!label) return "";
      const isBye = picture.champs.some((c) => c.id === id);
      const cls = label.kind === "div" ? (isBye ? "div lead" : "div") : label.kind;
      const title = isBye ? `${label.note}` : label.note;
      return `<span class="seed-tag ${cls}" title="${title}">${label.chip}</span>`;
    }

    function clinchTag(picture, id) {
      const flag = picture.flags[id];
      if (!flag) return "";
      return `<span class="clinch-tag ${flag}" title="${CLINCH_KEY[flag].title}">${CLINCH_KEY[flag].label}</span>`;
    }

    function whyButton(picture, id, scope) {
      const entries = picture.reasons[id];
      if (!entries || !entries.length) return "";
      const key = `${scope}:${id}`;
      whyStore[key] = {
        team: teams[id].name,
        entries: entries.map((r) => ({
          race: r.race,
          criterion: r.criterion,
          detail: r.detail,
          over: r.over ? teams[r.over].name : null,
          under: r.under ? teams[r.under].name : null
        }))
      };
      return `<button type="button" class="why-btn" data-why="${key}"
        aria-label="Tiebreakers involving ${teams[id].name}">i</button>`;
    }

    function teamFlags(picture, id, scope) {
      const inner = seedTag(picture, id) + clinchTag(picture, id) + whyButton(picture, id, scope);
      return inner ? `<span class="team-flags">${inner}</span>` : "";
    }

    function gbText(leader, t) {
      const back = gamesBack(leader, t);
      return back <= 0 ? "—" : (back % 1 ? back.toFixed(1) : String(back));
    }

    function standingsLegend(picture) {
      const anyFlag = TEAM_IDS.some((id) => picture.flags[id]);
      return `<div class="standings-note">
        <span class="legend-key"><span class="seed-tag div lead">X1</span>Division leader · first-round bye</span>
        <span class="legend-key"><span class="seed-tag div">X2</span>Division runner-up</span>
        <span class="legend-key"><span class="seed-tag wc">WC</span>Wild card</span>
        <span class="legend-key"><span class="seed-tag out">#7</span>Toilet Bowl</span>
        ${anyFlag ? `<span class="legend-key"><span class="clinch-tag z">z</span>Clinched division</span>
        <span class="legend-key"><span class="clinch-tag x">x</span>Clinched a berth</span>
        <span class="legend-key"><span class="clinch-tag e">e</span>Eliminated</span>` : ""}
        <span class="legend-key"><span class="why-btn" aria-hidden="true">i</span>Tap for the tiebreaker</span>
      </div>`;
    }

    /* Tiebreaker popover ------------------------------------------- */

    let whyPop = null;

    function closeWhy() {
      if (whyPop) { whyPop.remove(); whyPop = null; }
    }

    function openWhy(button) {
      closeWhy();
      const info = whyStore[button.dataset.why];
      if (!info) return;

      const pop = document.createElement("div");
      pop.className = "why-pop";
      pop.setAttribute("role", "dialog");
      pop.innerHTML = `
        <div class="why-head">${info.team} · ${info.entries.length} tiebreak${info.entries.length === 1 ? "" : "s"}</div>
        ${info.entries.map((e) => `
          <div class="why-entry">
            <h4>${e.race} · ${e.criterion}</h4>
            <p>${e.detail}</p>
            ${e.over ? `<div class="why-team">Placed ahead of ${e.over}.</div>`
              : e.under ? `<div class="why-team">Placed behind ${e.under}.</div>` : ""}
          </div>`).join("")}`;
      document.body.appendChild(pop);

      const anchor = button.getBoundingClientRect();
      const box = pop.getBoundingClientRect();
      const margin = 12;
      let left = anchor.left + anchor.width / 2 - box.width / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - box.width - margin));
      let top = anchor.bottom + 8;
      if (top + box.height > window.innerHeight - margin) top = Math.max(margin, anchor.top - box.height - 8);
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
      whyPop = pop;
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest(".why-btn[data-why]");
      if (button) { event.stopPropagation(); openWhy(button); return; }
      if (whyPop && !event.target.closest(".why-pop")) closeWhy();
    });

    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeWhy(); });
    window.addEventListener("resize", closeWhy);
    window.addEventListener("scroll", closeWhy, true);
