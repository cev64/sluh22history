       ================================================================= */

    function gameCard(week, a, as, b, bs) {
      const aWon = as > bs, bWon = bs > as;
      const margin = Math.abs(as - bs);
      const side = (id, score, won) => `
        <div class="game-side ${won ? "winner" : ""}">
          <span class="win-flag"></span>
          ${miniTeam(id)}
          <button type="button" class="game-team" data-team="${id}" aria-label="Open ${teams[id].name} schedule">
            <strong>${teams[id].name}</strong><span>${teams[id].owner}</span>
          </button>
          <span class="game-score">${fmt(score)}</span>
        </div>`;
      return `<article class="game-card">
        <div class="game-card-head">
          <span>Week ${week}${week === rivalryWeek ? " · Rivalry" : ""}</span>
          <span class="game-margin">${as === bs ? "Tie" : `Margin ${fmt(margin)}`}</span>
        </div>
        ${side(a, as, aWon)}
        ${side(b, bs, bWon)}
      </article>`;
    }

    function weekSuperlatives(week) {
      const games = results[week] || [];
      if (!games.length) return "";
      const scores = [];
      games.forEach(([a, as, b, bs]) => { scores.push({ id: a, score: as }); scores.push({ id: b, score: bs }); });
      const byScore = scores.slice().sort((x, y) => y.score - x.score);
      const byMargin = games.slice().sort((x, y) => Math.abs(y[1] - y[3]) - Math.abs(x[1] - x[3]));
      const blowout = byMargin[0];
      const nailbiter = byMargin[byMargin.length - 1];
      const total = scores.reduce((sum, s) => sum + s.score, 0);

      const item = (label, strong, sub) => `<div class="superlative"><small>${label}</small><strong>${strong}</strong><span>${sub}</span></div>`;
      const winnerOf = (g) => (g[1] >= g[3] ? g[0] : g[2]);
      const loserOf = (g) => (g[1] >= g[3] ? g[2] : g[0]);

      return `<div class="summary-superlatives">
        ${item("High score", teams[byScore[0].id].name, fmt(byScore[0].score))}
        ${item("Low score", teams[byScore[byScore.length - 1].id].name, fmt(byScore[byScore.length - 1].score))}
        ${item("Biggest blowout", `${teams[winnerOf(blowout)].name} over ${teams[loserOf(blowout)].name}`, `by ${fmt(Math.abs(blowout[1] - blowout[3]))}`)}
        ${item("Closest game", `${teams[winnerOf(nailbiter)].name} over ${teams[loserOf(nailbiter)].name}`, `by ${fmt(Math.abs(nailbiter[1] - nailbiter[3]))}`)}
        ${item("League average", `${fmt1(total / scores.length)} per team`, `${fmt(total)} total points`)}
      </div>`;
    }

    /* =================================================================
       TEAM DRAWER
       ================================================================= */

    const drawer = document.getElementById("teamDrawer");
    const backdrop = document.getElementById("drawerBackdrop");

    function seasonScheduleFor(teamId) {
      const rows = [];
      for (let w = 1; w <= REGULAR_WEEKS; w++) {
        const game = (schedule[w] || []).find(([a, b]) => a === teamId || b === teamId);
        if (!game) continue;
        const opponent = game[0] === teamId ? game[1] : game[0];
        const scored = (results[w] || []).find(([a, , b]) => a === teamId || b === teamId);
        if (scored) {
          const isFirst = scored[0] === teamId;
          const teamScore = isFirst ? scored[1] : scored[3];
          const oppScore = isFirst ? scored[3] : scored[1];
          rows.push({
            week: w, opponent, teamScore, oppScore,
            result: teamScore > oppScore ? "W" : teamScore < oppScore ? "L" : "T",
            played: true
          });
        } else {
          rows.push({ week: w, opponent, played: false });
        }
      }
      return rows;
    }

    function scheduleRows(items) {
      return items.map((g) => {
        const opponent = teams[g.opponent];
        const pill = g.played
          ? `<span class="result-pill ${g.result === "W" ? "win" : g.result === "L" ? "loss" : "bye"}">${g.result}</span>`
          : `<span class="result-pill pending">–</span>`;
        const score = g.played
          ? `<strong>${fmt(g.teamScore)}–${fmt(g.oppScore)}</strong><span>NFL Week ${g.week}</span>`
          : `<strong>—</strong><span>Not played</span>`;
        return `<div class="schedule-row">
          <span class="schedule-week">Week ${g.week}</span>
          ${pill}
          <span class="schedule-opponent"><strong>vs ${opponent.name}</strong><span>${opponent.owner}</span></span>
          <span class="schedule-score">${score}</span>
        </div>`;
      }).join("");
    }

    function openTeam(teamId) {
      const t = teams[teamId];
      const asOf = asOfWeek(state.week);
      const picture = buildPicture(asOf);
      const line = picture.stats[teamId];
      const seed = asOf > 0 ? picture.seedLabels[teamId] : null;

      document.getElementById("drawerHero").style.setProperty("--drawer-color", t.color);
      const badge = document.getElementById("drawerBadge");
      badge.style.setProperty("--team-color", t.color);
      badge.textContent = t.icon;
      document.getElementById("drawerName").textContent = t.name;
      document.getElementById("drawerOwner").textContent = `${t.owner} · ${t.division} Division`;
      document.getElementById("drawerStats").innerHTML = `
        <div class="drawer-stat"><small>Record</small><strong>${line.record}</strong></div>
        <div class="drawer-stat"><small>Points For</small><strong>${fmt(line.pf)}</strong></div>
        <div class="drawer-stat"><small>Points Against</small><strong>${fmt(line.pa)}</strong></div>
        <div class="drawer-stat"><small>Current Seed</small><strong>${seed ? seed.chip : "—"}</strong></div>`;

      document.getElementById("drawerBody").innerHTML = `
        <section class="schedule-section">
          <div class="schedule-heading"><h3>2026 Schedule</h3><span>Weeks 1–${REGULAR_WEEKS}</span></div>
          <div class="schedule-list">${scheduleRows(seasonScheduleFor(teamId))}</div>
        </section>`;

      drawer.classList.add("open");
      backdrop.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeTeam() {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    /* =================================================================
       RENDER + ROUTING
       ================================================================= */

    function renderAll() {
      renderWeekRail();
      renderViewTabs();
      renderHero(state.week);
      renderResultsPanel(state.week);
      renderStandingsPanel(state.week);
      renderPicturePanel(state.week);
      renderSummaryPanel(state.week);
      document.querySelectorAll(".live-panel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === `panel-${state.view}`);
      });
    }

    function applyHash() {
      const match = /^#w(\d{1,2})(?:-(results|standings|picture|summary))?$/.exec(window.location.hash || "");
      if (!match) return false;
      const week = Number(match[1]);
      if (week < 0 || week > REGULAR_WEEKS) return false;
      state.week = week;
      state.view = match[2] || "results";
      return true;
    }

    function writeHash() {
      const next = `#w${state.week}-${state.view}`;
      if (window.location.hash !== next) history.replaceState(null, "", next);
    }

    document.getElementById("weekRail").addEventListener("click", (event) => {
      const pill = event.target.closest(".week-pill");
      if (!pill) return;
      state.week = Number(pill.dataset.week);
      renderAll();
      writeHash();
    });

    document.getElementById("weekSelect").addEventListener("change", (event) => {
      state.week = Number(event.target.value);
      renderAll();
      writeHash();
    });

    document.getElementById("viewTabs").addEventListener("click", (event) => {
      const tab = event.target.closest(".view-tab");
      if (!tab) return;
      state.view = tab.dataset.view;
      renderViewTabs();
      document.querySelectorAll(".live-panel").forEach((panel) => {
        panel.classList.toggle("active", panel.id === `panel-${state.view}`);
      });
      writeHash();
    });

    document.addEventListener("click", (event) => {
      if (event.target.closest(".week-pill") || event.target.closest(".view-tab")) return;
      const team = event.target.closest("[data-team]");
      if (team) openTeam(team.dataset.team);
    });

    document.getElementById("drawerClose").addEventListener("click", closeTeam);
    backdrop.addEventListener("click", closeTeam);
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeTeam(); });

    window.addEventListener("hashchange", () => { if (applyHash()) renderAll(); });

    document.getElementById("yearSelect").addEventListener("change", (event) => {
      const files = {
        home: "index.html",
        2026: "2026.html",
        2025: "2025.html",
        2024: "2024.html",
        2023: "2023.html",
        2022: "2022.html",
        2021: "2021.html"
      };
      const target = files[event.target.value];
      if (target) window.location.href = target;
    });

    applyHash();
    renderAll();
    writeHash();
  </script>
</body>
</html>
